<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Спрощений ядерний реактор у розрізі (3D)</title>

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: #0b1020; }
    canvas { display: block; }

    /* Labels (CSS2DRenderer) */
    .label {
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(0,0,0,.55);
      color: #fff;
      font: 13px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      border: 1px solid rgba(255,255,255,.16);
      white-space: nowrap;
      pointer-events: none;
      backdrop-filter: blur(6px);
    }
    .label small { opacity: 0.8; font-size: 11px; }

    /* UI */
    #ui {
      position: fixed; top: 12px; left: 12px;
      width: min(360px, calc(100vw - 24px));
      background: rgba(0,0,0,.45);
      color: #fff;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px;
      padding: 10px 10px 8px;
      font: 14px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      backdrop-filter: blur(10px);
    }
    #ui h1 {
      margin: 0 0 8px 0;
      font-size: 14px;
      font-weight: 650;
    }
    #ui .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    #ui label { display: flex; gap: 8px; align-items: center; user-select: none; }
    #ui input[type="checkbox"] { transform: translateY(1px); }
    #ui .hint { margin-top: 8px; opacity: 0.85; font-size: 12px; line-height: 1.35; }
    #ui .pill {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      margin-right: 6px;
      font-size: 12px;
    }

    /* crosshair-ish helper (optional) */
    #footer {
      position: fixed; bottom: 10px; left: 12px;
      color: rgba(255,255,255,.85);
      font: 12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: rgba(0,0,0,.35);
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(10px);
    }
  </style>

  <!-- importmap (варіант B) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>

<body>
  <div id="ui">
    <h1>Ядерний реактор (спрощено) — розріз + підписи</h1>
    <div class="row">
      <label><input id="chkVessel" type="checkbox" checked> Корпус/кришка</label>
      <label><input id="chkWater" type="checkbox" checked> Теплоносій (вода)</label>
      <label><input id="chkCore" type="checkbox" checked> Активна зона</label>
      <label><input id="chkFuel" type="checkbox" checked> Паливні стрижні</label>
      <label><input id="chkRods" type="checkbox" checked> Керуючі стрижні</label>
      <label><input id="chkCut" type="checkbox" checked> Межа розрізу</label>
      <label><input id="chkLabels" type="checkbox" checked> Підписи</label>
    </div>
    <div class="hint">
      <span class="pill">ЛКМ</span>обертання
      <span class="pill">Колесо</span>масштаб
      <span class="pill">ПКМ</span>панорама
      <br/>Це навчальна візуалізація, не інженерна модель.
    </div>
  </div>

  <div id="footer">Порада: вимкніть “Корпус”, щоб бачити нутрощі ще краще.</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";
    import { CSS2DRenderer, CSS2DObject } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/renderers/CSS2DRenderer.js";

    // ===== Scene =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1020);

    // subtle fog
    scene.fog = new THREE.Fog(0x0b1020, 40, 160);

    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 600);
    camera.position.set(22, 18, 28);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // CSS2D labels renderer
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(innerWidth, innerHeight);
    labelRenderer.domElement.style.position = "fixed";
    labelRenderer.domElement.style.top = "0";
    labelRenderer.domElement.style.left = "0";
    labelRenderer.domElement.style.pointerEvents = "none";
    document.body.appendChild(labelRenderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 9, 0);

    // ===== Lights =====
    scene.add(new THREE.AmbientLight(0xffffff, 0.35));

    const key = new THREE.DirectionalLight(0xffffff, 1.1);
    key.position.set(25, 35, 18);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -50;
    key.shadow.camera.right = 50;
    key.shadow.camera.top = 50;
    key.shadow.camera.bottom = -50;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0x7fb2ff, 0.35);
    fill.position.set(-18, 20, -25);
    scene.add(fill);

    // ===== Ground (for shadows) =====
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0x11172f, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.receiveShadow = true;
    scene.add(ground);

    // ===== Reactor Cutaway (grouped layers) =====
    const layers = {
      vessel: new THREE.Group(),
      water:  new THREE.Group(),
      core:   new THREE.Group(),
      fuel:   new THREE.Group(),
      rods:   new THREE.Group(),
      cut:    new THREE.Group(),
      labels: new THREE.Group()
    };
    const reactor = new THREE.Group();
    reactor.position.set(0, 0, 0);
    reactor.rotation.y = -Math.PI / 5; // turn cut toward camera
    scene.add(reactor);
    for (const k of Object.keys(layers)) reactor.add(layers[k]);

    const vesselRadius = 6.2;
    const vesselHeight = 18;

    // Sector cut
    const thetaStart = 0.35;
    const thetaLength = Math.PI * 0.85;

    // Materials
    const matSteel = new THREE.MeshStandardMaterial({ color: 0x8a8f95, roughness: 0.55, metalness: 0.35 });
    const matInner = new THREE.MeshStandardMaterial({ color: 0x6f7378, roughness: 0.75, metalness: 0.15 });
    const matWater = new THREE.MeshStandardMaterial({
      color: 0x2d7dd2, roughness: 0.15, metalness: 0.05,
      transparent: true, opacity: 0.55
    });
    const matFuel  = new THREE.MeshStandardMaterial({ color: 0x2d2d2d, roughness: 0.92 });
    const matRod   = new THREE.MeshStandardMaterial({ color: 0xb3b3b3, roughness: 0.45, metalness: 0.2 });
    const matCore  = new THREE.MeshStandardMaterial({ color: 0x3b3b3b, roughness: 0.95 });
    const matCut   = new THREE.MeshStandardMaterial({ color: 0xffc857, roughness: 0.8 });

    // --- Vessel
    const vesselGeo = new THREE.CylinderGeometry(vesselRadius, vesselRadius, vesselHeight, 48, 1, false, thetaStart, thetaLength);
    const vessel = new THREE.Mesh(vesselGeo, matSteel);
    vessel.position.set(0, vesselHeight / 2, 0);
    vessel.castShadow = true;
    vessel.receiveShadow = true;
    layers.vessel.add(vessel);

    // Inner liner
    const linerGeo = new THREE.CylinderGeometry(vesselRadius * 0.92, vesselRadius * 0.92, vesselHeight * 0.96, 48, 1, true, thetaStart, thetaLength);
    const liner = new THREE.Mesh(linerGeo, matInner);
    liner.position.set(0, vesselHeight / 2, 0);
    liner.castShadow = true;
    liner.receiveShadow = true;
    layers.vessel.add(liner);

    // Head (top dome)
    const headGeo = new THREE.SphereGeometry(vesselRadius, 48, 24, thetaStart, thetaLength, 0, Math.PI / 2);
    const head = new THREE.Mesh(headGeo, matSteel);
    head.position.set(0, vesselHeight, 0);
    head.castShadow = true;
    head.receiveShadow = true;
    layers.vessel.add(head);

    // --- Water
    const waterGeo = new THREE.CylinderGeometry(vesselRadius * 0.87, vesselRadius * 0.87, vesselHeight * 0.88, 48, 1, true, thetaStart, thetaLength);
    const water = new THREE.Mesh(waterGeo, matWater);
    water.position.set(0, vesselHeight / 2, 0);
    water.castShadow = false;
    water.receiveShadow = true;
    layers.water.add(water);

    // --- Core
    const coreH = vesselHeight * 0.42;
    const coreY = vesselHeight * 0.30;
    const coreR = vesselRadius * 0.50;

    const coreBarrelGeo = new THREE.CylinderGeometry(coreR * 1.08, coreR * 1.08, coreH, 36, 1, false, thetaStart, thetaLength);
    const coreBarrel = new THREE.Mesh(coreBarrelGeo, matCore);
    coreBarrel.position.set(0, coreY, 0);
    coreBarrel.castShadow = true;
    coreBarrel.receiveShadow = true;
    layers.core.add(coreBarrel);

    // --- Fuel rods (simplified lattice)
    const fuelRodGeo = new THREE.CylinderGeometry(0.12, 0.12, coreH * 0.92, 12);
    const pitch = 0.6;
    const half = 5; // 11x11

    for (let ix = -half; ix <= half; ix++) {
      for (let iz = -half; iz <= half; iz++) {
        const fx = ix * pitch;
        const fz = iz * pitch;
        if (fx*fx + fz*fz > (coreR * 0.92) ** 2) continue;

        const rod = new THREE.Mesh(fuelRodGeo, matFuel);
        rod.position.set(fx, coreY, fz);
        rod.castShadow = true;
        rod.receiveShadow = true;
        layers.fuel.add(rod);
      }
    }

    // --- Control rods
    const ctrlGeo = new THREE.CylinderGeometry(0.18, 0.18, coreH * 0.95, 14);
    const ctrlPositions = [
      [-1.2, -1.2], [1.2, -1.2], [-1.2, 1.2], [1.2, 1.2],
      [0, 0], [0, 2.0], [2.0, 0], [-2.0, 0], [0, -2.0]
    ];
    for (const [cx, cz] of ctrlPositions) {
      const c = new THREE.Mesh(ctrlGeo, matRod);
      c.position.set(cx, coreY + 0.15, cz);
      c.castShadow = true;
      c.receiveShadow = true;
      layers.rods.add(c);
    }

    // --- Cut boundary walls (visual “slice”)
    function addCutWall(angle) {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(vesselRadius * 2.1, vesselHeight * 1.05, 0.08), matCut);
      wall.position.set(0, vesselHeight / 2, 0);
      wall.rotation.y = angle;
      wall.castShadow = false;
      wall.receiveShadow = true;
      layers.cut.add(wall);
    }
    addCutWall(thetaStart);
    addCutWall(thetaStart + thetaLength);

    // “heat glow” light in the core
    const glow = new THREE.PointLight(0xff6b3d, 1.2, 26, 2);
    glow.position.set(0, coreY, 0);
    layers.core.add(glow);

    // ===== Labels =====
    function makeLabel(html) {
      const div = document.createElement("div");
      div.className = "label";
      div.innerHTML = html;
      return new CSS2DObject(div);
    }

    const labels = [
      { text: "Корпус реактора<br/><small>(pressure vessel)</small>", pos: new THREE.Vector3(5.2, 10.5, 0) },
      { text: "Теплоносій (вода)<br/><small>під тиском</small>", pos: new THREE.Vector3(2.8, 9.0, 3.2) },
      { text: "Активна зона<br/><small>(core)</small>", pos: new THREE.Vector3(-1.8, coreY + 1.2, -3.8) },
      { text: "Паливні стрижні<br/><small>(fuel rods)</small>", pos: new THREE.Vector3(1.6, coreY + 0.4, -1.8) },
      { text: "Керуючі стрижні<br/><small>(control rods)</small>", pos: new THREE.Vector3(-2.8, coreY + 2.4, 1.7) },
      { text: "Лінія розрізу<br/><small>(cut plane)</small>", pos: new THREE.Vector3(0.0, 12.0, 7.6) }
    ];

    for (const l of labels) {
      const obj = makeLabel(l.text);
      obj.position.copy(l.pos);
      layers.labels.add(obj);
    }

    // ===== UI wiring =====
    const $ = (id) => document.getElementById(id);

    function bindLayer(checkboxId, layerKey) {
      const el = $(checkboxId);
      el.addEventListener("change", () => {
        layers[layerKey].visible = el.checked;
      });
      layers[layerKey].visible = el.checked;
    }

    bindLayer("chkVessel", "vessel");
    bindLayer("chkWater",  "water");
    bindLayer("chkCore",   "core");
    bindLayer("chkFuel",   "fuel");
    bindLayer("chkRods",   "rods");
    bindLayer("chkCut",    "cut");

    const chkLabels = $("chkLabels");
    chkLabels.addEventListener("change", () => {
      layers.labels.visible = chkLabels.checked;
      labelRenderer.domElement.style.display = chkLabels.checked ? "" : "none";
    });

    // ===== Render loop =====
    function animate() {
      requestAnimationFrame(animate);

      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
    animate();

    // ===== Resize =====
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(innerWidth, innerHeight);
      labelRenderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
